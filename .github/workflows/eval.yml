name: tests and evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # The full offline suite: real PDF, real chunking and Chroma index, stand-in
    # models. Needs no Ollama, so it is fast and deterministic.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Offline test suite
        run: pytest -m "not realmodel" -q
      - name: Offline retrieval gate
        env:
          RAG_RETRIEVAL_MODE: vector
        run: python -m evals.retrieval --offline --check-baseline

  retrieval-real-embeddings:
    # Retrieval with the real embedding model. No chat model is needed, so this
    # stays cheap enough to run on every pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Install Ollama and pull the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull nomic-embed-text
      - name: Ingest
        run: python -m rag.ingest
      - name: Retrieval gate (fails if Recall@5 drops below the committed baseline)
        env:
          RAG_RETRIEVAL_MODE: vector
        run: python -m evals.retrieval --check-baseline

  answers:
    # Answer quality needs a chat model and an LLM judge: slow and noisy on a
    # CI runner, so it only runs when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Install Ollama and pull models
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull nomic-embed-text
          ollama pull gemma2:2b
      - name: Answer evals
        run: python -m evals.answers
      - uses: actions/upload-artifact@v4
        with:
          name: answer-evals
          path: evals/results/*-answers.csv
